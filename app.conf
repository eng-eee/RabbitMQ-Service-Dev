# Order Processing System - local development configuration.
#
# Every value can be overridden by the environment variable of the same name,
# which is how the Docker Compose stack configures the services.

# --- RabbitMQ connection ---------------------------------------------------
RABBITMQ_HOST=localhost
RABBITMQ_PORT=5672
RABBITMQ_DEFAULT_USER=developer
RABBITMQ_DEFAULT_PASS=developer123
RABBITMQ_VHOST=/
RABBITMQ_HEARTBEAT_SECONDS=60
RABBITMQ_AUTO_RECONNECT=true
RABBITMQ_EXCHANGE=order.events

# --- Inventory service -----------------------------------------------------
# Stock assumed for a product the first time it is requested.
INVENTORY_DEFAULT_STOCK=100

# --- Payment service -------------------------------------------------------
# 0.0 = never fail randomly. Set e.g. 0.25 to simulate failures.
PAYMENT_FAILURE_RATE=0.0
# Payments above this amount are always declined.
PAYMENT_MAX_AMOUNT=5000

# --- Order monitor service -------------------------------------------------
MONITOR_INCOMPLETE_TIMEOUT_SECONDS=60
MONITOR_INTERVAL_SECONDS=5
